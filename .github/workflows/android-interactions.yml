name: Android interaction verification
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the built android-verification APK
        required: true
        default: '36676708293'
permissions:
  contents: read
  actions: read
jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-verification
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: built
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise existing editor interactions
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: built/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: python3 -u scripts/android-interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-interactions
          path: verification/
