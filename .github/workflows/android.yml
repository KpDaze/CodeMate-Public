name: Android migration checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: python3 scripts/verify-baseline.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:android
      - run: npm run prebuild:android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK with bundled JavaScript
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64,arm64-v8a
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android UI smoke check
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: |
            python3 -u scripts/android-smoke.py
            python3 -u scripts/android-interactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            verification/
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
